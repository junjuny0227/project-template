version: 2

updates:
  # pnpm 워크스페이스와 catalog 버전은 루트에서 함께 갱신한다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    # 기존 정확한 버전 표기를 유지하며 새 버전으로 올린다.
    versioning-strategy: increase
    # 메이저를 직접 올리는 의존성이다. typescript는 typescript-eslint(와 fullstack의 openapi-typescript)가
    # 새 메이저를 지원한 뒤에, @types/node는 실행 환경(.nvmrc, engines, CI)의 Node 메이저를 올릴 때 함께 올린다.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # 메이저 업데이트는 그룹에 넣지 않고 개별 PR로 검토한다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
