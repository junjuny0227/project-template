name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://template:template@localhost:5432/template
      PORT: '4000'
      CORS_ORIGINS: http://localhost:3000
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm 버전은 package.json의 packageManager(pnpm@12.18.0)를 따른다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prepare Test Environment
        run: |
          node -e "console.log('JWT_SECRET=' + require('node:crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"

      - name: Start Database
        run: docker compose up -d --wait

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check FSD architecture
        run: pnpm lint:fsd

      - name: Check Formatting
        run: pnpm format:check

      - name: Type Check
        run: pnpm check-types

      - name: Unit Test
        run: pnpm test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E Test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Stop Database
        if: always()
        run: docker compose down --volumes --remove-orphans
