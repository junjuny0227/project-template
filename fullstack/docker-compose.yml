services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template -d template']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
